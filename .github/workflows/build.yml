name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它会跑 `sdkmanager tools`，
      # 而 Google 已把 tools 包下线，导致 "Failed to find package 'tools'" 直接失败。
      # ubuntu runner 自带 Android SDK，这里只把 cmdline-tools 加进 PATH 并补装需要的包。
      - name: Set up Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          if [ -z "$SDKM" ]; then
            echo "没找到 cmdline-tools，落回 PATH 里的 sdkmanager"
          else
            echo "$SDKM" >> "$GITHUB_PATH"
            export PATH="$SDKM:$PATH"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          which sdkmanager || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jizhang-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 记账本 APK build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            自动构建的 debug 版记账本 APK，可直接下载安装。
            构建时间：${{ github.event.repository.updated_at }}
